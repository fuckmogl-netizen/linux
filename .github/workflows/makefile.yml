name: Makefile CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: make
      run: make defconfig

    - name: make 
      run: make

    - name: Install dependencies
      run: make insta;;

    - name: Run check
      run: make check

    - name: Run distcheck
      run: make distcheck
